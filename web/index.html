<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pane</title>
  <meta name="color-scheme" content="light">
  <script>
    (function () {
      var t = 'light';
      try { if (localStorage.getItem('pane-theme') === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').content = t;
    })();
  </script>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
  <header>
    <div class="brand">Pane</div>
    <div id="status">connecting…</div>
    <div id="cwd"></div>
    <button type="button" id="thoughts" aria-pressed="false">Thoughts</button>
    <button type="button" id="theme">Dark</button>
  </header>
  <main id="term"></main>
  <footer>
    <textarea id="in" rows="2" placeholder="Message…" autocomplete="off"></textarea>
    <button type="button" id="send" disabled>Send</button>
  </footer>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/term.js?v=2"></script>
</body>
</html>
