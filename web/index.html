<!DOCTYPE html>
<html lang="en" data-busy="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Pane</title>
  <meta name="color-scheme" content="light">
  <script>
    (function () {
      var t = 'light';
      try { if (localStorage.getItem('pane-theme') === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').content = t;
    })();
  </script>
  <link rel="icon" href="favicon.png">
  <link rel="preload" href="fonts/iosevka-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=44">
</head>
<body>
  <div id="shell">
  <aside id="rail">
    <div class="brand">Grok Pane</div>
    <button type="button" id="project" title="Open a project folder">Open project</button>
    <button type="button" id="change-project" title="Choose a different folder">Change project…</button>
    <button type="button" id="new-session" title="Send a message first" disabled>New session</button>
    <div class="rail-label">Projects</div>
    <div id="projects"></div>
    <div class="rail-label">Sessions</div>
    <div id="sessions"></div>
    <div class="rail-label">Remote</div>
    <div id="remote"></div>
  </aside>
  <div id="workspace">
    <header>
      <button type="button" id="cwd" hidden title=""></button>
      <button type="button" id="thoughts" aria-pressed="false">Thoughts</button>
      <button type="button" id="theme">Dark</button>
    </header>
    <main id="log"></main>
    <footer>
      <div id="queue" hidden></div>
      <div id="live">
        <span id="spin" aria-hidden="true"></span>
        <div id="status" aria-live="polite">connecting…</div>
      </div>
      <div class="composer">
        <div id="chips" hidden></div>
        <textarea id="in" rows="2" placeholder="Message…" autocomplete="off"></textarea>
        <div class="composer-bar">
          <button type="button" id="attach" title="Attach files or images">+</button>
          <input type="file" id="file" hidden multiple>
          <div class="usage-wrap">
            <button type="button" id="usage" class="usage" title="Context usage — click for details" aria-label="Context usage" aria-expanded="false" aria-controls="usage-pop">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle class="usage-track" cx="10" cy="10" r="7"></circle>
                <circle id="usage-ring" class="usage-ring" cx="10" cy="10" r="7" transform="rotate(-90 10 10)"></circle>
              </svg>
            </button>
            <div id="usage-pop" class="usage-pop" hidden role="dialog" aria-label="Context usage details"></div>
          </div>
          <select id="model" aria-label="Model"></select>
          <select id="effort" aria-label="Effort"></select>
          <button type="button" id="send" disabled>Send</button>
        </div>
      </div>
    </footer>
  </div>
  </div>
  <script>
    (function () {
      var shell = document.getElementById('shell');
      var rail = document.getElementById('rail');
      var ws = document.getElementById('workspace');
      if (!shell || !rail || !ws) return;
      if (rail.parentNode !== shell) shell.insertBefore(rail, shell.firstChild);
      if (ws.parentNode !== shell) shell.appendChild(ws);
    })();
  </script>
  <div id="drop" hidden>Drop files to attach</div>
  <div id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="button" id="modal-ok">Delete</button>
      </div>
    </div>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="term.js?v=45"></script>
</body>
</html>
