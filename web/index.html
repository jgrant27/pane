<!DOCTYPE html>
<html lang="en" data-busy="false">
<head>
  <meta charset="utf-8">
  <!-- Agent output is rendered as markdown in this document, so the page
       must not be able to reach the network on its behalf: no remote
       images (a bare <img> is an exfiltration beacon), no injected
       stylesheet that could repaint the permission card, no inline
       script. The two script hashes below are this file's own inline
       scripts — web/layout_test.go recomputes them, so editing either
       script without updating this header fails the build. connect-src
       stays wide because a pane can be reached at any tailnet or LAN
       origin the user points the UI at. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; img-src 'self' data: blob:; font-src 'self'; style-src 'self'; script-src 'self' 'sha256-bfOhHb3O+cl91lK58sV9xqzHFAMgOmUgZSgnFHF2NW8=' 'sha256-cLXj8kQk6Fr6BhYbPqy/BCeBGWh3swZBh8Zx92+f3k8='; connect-src 'self' http: https: ws: wss:">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grok Pane</title>
  <meta name="color-scheme" content="light">
  <!-- pane fills this in when it serves the page; only a same-origin
       document can read it back. -->
  <meta name="pane-token" content="">
  <script>
    (function () {
      var t = 'light';
      try { if (localStorage.getItem('pane-theme') === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').content = t;
      try {
        var n = parseInt(localStorage.getItem('pane-rail-w') || '', 10);
        if (n >= 220 && n <= 480) {
          document.documentElement.style.setProperty('--rail-w', n + 'px');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="favicon.png">
  <link rel="preload" href="fonts/iosevka-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=54">
</head>
<body>
  <div id="shell">
  <aside id="rail">
    <div class="brand">Grok Pane</div>
    <button type="button" id="project" title="Open a project folder">Open project</button>
    <button type="button" id="change-project" title="Choose a different folder">Change project…</button>
    <button type="button" id="new-session" title="Send a message first" disabled>New session</button>
    <div class="rail-label">Projects</div>
    <div id="projects"></div>
    <div class="rail-label">Sessions</div>
    <div id="sessions"></div>
    <div class="rail-label">Remote</div>
    <div id="remote"></div>
    <div id="rail-split" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="220" aria-valuemax="480" aria-valuenow="280" tabindex="0"></div>
  </aside>
  <div id="workspace">
    <header>
      <button type="button" id="cwd" hidden title=""></button>
      <button type="button" id="thoughts" aria-pressed="false" title="Reasoning hidden — click to show">Thoughts</button>
      <button type="button" id="autoscroll" aria-pressed="true" title="Follow new output">Follow</button>
      <button type="button" id="theme">Dark</button>
    </header>
    <main id="log">
      <button type="button" id="jump-bottom" hidden title="Jump to latest" aria-label="Jump to latest">↓</button>
    </main>
    <footer>
      <div id="queue" hidden></div>
      <div id="live" hidden>
        <span id="spin" aria-hidden="true"></span>
        <div id="status" aria-live="polite"></div>
      </div>
      <div class="composer">
        <div id="chips" hidden></div>
        <textarea id="in" rows="2" placeholder="Message…" autocomplete="off"></textarea>
        <div class="composer-bar">
          <button type="button" id="attach" title="Attach files or images">+</button>
          <input type="file" id="file" hidden multiple>
          <div class="usage-wrap">
            <button type="button" id="usage" class="usage" title="Context usage — click for details" aria-label="Context usage" aria-expanded="false" aria-controls="usage-pop">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle class="usage-track" cx="10" cy="10" r="7"></circle>
                <circle id="usage-ring" class="usage-ring" cx="10" cy="10" r="7" transform="rotate(-90 10 10)"></circle>
              </svg>
            </button>
            <div id="usage-pop" class="usage-pop" hidden role="dialog" aria-label="Context usage details"></div>
          </div>
          <select id="model" aria-label="Model"></select>
          <select id="effort" aria-label="Effort"></select>
          <button type="button" id="send" disabled>Send</button>
        </div>
      </div>
    </footer>
  </div>
  </div>
  <script>
    (function () {
      var shell = document.getElementById('shell');
      var rail = document.getElementById('rail');
      var ws = document.getElementById('workspace');
      if (!shell || !rail || !ws) return;
      if (rail.parentNode !== shell) shell.insertBefore(rail, shell.firstChild);
      if (ws.parentNode !== shell) shell.appendChild(ws);
    })();
  </script>
  <div id="drop" hidden>Drop files to attach</div>
  <div id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="button" id="modal-ok">Delete</button>
      </div>
    </div>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="term.js?v=58"></script>
</body>
</html>
