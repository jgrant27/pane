name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test $(go list ./... | grep -v '/desktop$')

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: darwin-arm64
          - os: ubuntu-24.04
            artifact: linux-amd64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: windows-latest
            artifact: windows-amd64
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          tags=production
          if [ "${{ runner.os }}" = "Linux" ] && pkg-config --exists webkit2gtk-4.1; then
            tags=production,webkit2_41
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o dist/pane.exe .
            go build -tags production -o dist/grok-pane.exe ./desktop
          else
            go build -o dist/pane .
            go build -tags "$tags" -o dist/grok-pane ./desktop
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            make desktop-app
            ditto -c -k --keepParent "Grok Pane.app" "dist/Grok-Pane.app.zip"
          fi
          go version > dist/build.txt
          echo "artifact=${{ matrix.artifact }}" >> dist/build.txt
          echo "tags=${tags}" >> dist/build.txt
          uname -a >> dist/build.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: grok-pane-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  qemu-linux:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build via QEMU/buildx
        run: |
          slug=${{ matrix.platform }}
          slug=${slug#linux/}
          mkdir -p "dist/linux-${slug}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f ci/Dockerfile.linux \
            --output "type=local,dest=dist/linux-${slug}" \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: grok-pane-qemu-linux-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: dist/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack
        run: |
          mkdir -p release
          for d in artifacts/grok-pane-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            (cd "$d" && zip -r "../../release/${name}.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
